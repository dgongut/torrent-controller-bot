name: Docker Hub description

# Publishes README.md, adapted by .github/scripts/dockerhub_readme.py, as the
# description of the image on Docker Hub.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/dockerhub_readme.py
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Hub description
        run: python3 .github/scripts/dockerhub_readme.py README.md DOCKERHUB.md

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dgongut/torrent-controller-bot
          readme-filepath: ./DOCKERHUB.md
          enable-url-completion: true
