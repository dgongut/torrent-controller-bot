services:
    torrent-controller-bot:
        environment:
            - TELEGRAM_TOKEN=
            - TELEGRAM_ADMIN=
            - TELEGRAM_GROUP=
            - TELEGRAM_THREAD=1
            - LANGUAGE=ES
            - TZ=Europe/Madrid
            - TORRENT_CLIENT=transmission # transmission | qbittorrent | deluge
            - TORRENT_CLIENT_HOST=
            - TORRENT_CLIENT_PORT=9091
            - TORRENT_CLIENT_USER=
            - TORRENT_CLIENT_PASSWORD=
        image: dgongut/torrent-controller-bot:latest
        container_name: torrent-controller-bot
        restart: always
        tty: true
        volumes:
            - ./config:/config # Ajustes persistentes del bot
